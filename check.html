<script>(function(){try{
var C=window.__APEX_C||"";var EP="/api/apex/event";
function send(o){o.id=o.id||(Date.now()+"-"+Math.random().toString(36).slice(2,9));
 var body=JSON.stringify(o);try{navigator.sendBeacon(EP,new Blob([body],{type:"application/json"}));return}catch(e){}
 try{fetch(EP,{method:"POST",headers:{"Content-Type":"application/json"},body:body,keepalive:true}).catch(function(){try{fetch("http://127.0.0.1:8792/api/apex/event",{method:"POST",headers:{"Content-Type":"application/json"},body:body}).catch(function(){})}catch(e){}})}catch(e){}}
var c=document.documentElement.getAttribute("data-apex-circle")||"general";
send({type:"pageview",page:location.pathname,circle:c,ref:document.referrer,ua:navigator.userAgent});
if("IntersectionObserver" in window){
 var o=new IntersectionObserver(function(es){es.forEach(function(en){
  if(en.isIntersecting&&en.intersectionRatio>=0.5){send({type:"impression",slot:en.target.getAttribute("data-apex-slot")||"body",page:location.pathname,circle:c});o.unobserve(en.target);}});},{threshold:[0.5]});
 setTimeout(function(){document.querySelectorAll("[data-apex-slot]").forEach(function(el){o.observe(el)})},800);
}})();</script>

<script>
(function(){
"use strict";
function g(u){return fetch(u+"?_="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});}
function set(i,v){var e=document.getElementById(i);if(e)e.textContent=v;}
function money(x){x=Number(x);return "$"+(isFinite(x)?x:0).toFixed(6);}
g("audit.json").then(function(a){
 if(!a){document.getElementById("at").textContent="لا تقرير — شغّل AUDIT.sh";return;}
 set("at","آخر فحص: "+new Date(a.at).toLocaleString());
 set("live",(Object.keys(a.live||{}).length-(a.live_missing||[]).length)+"/"+Object.keys(a.live||{}).length);
 set("films",(a.content||{}).films||0); set("adult",(a.content||{}).adult||0);
 set("keys",(a.keys||{}).valid||0); set("ads",(a.agent||{}).ad_requests||0);
 set("bal",money((a.money||{}).balance));
 var G=document.getElementById("gaps");
 G.innerHTML=(a.gaps||[]).map(function(x){
  return "<div class='box "+x.sev+"'><b>"+x.what+"</b><div class='c'>الإصلاح: "+x.fix+"</div>"+
   (x.how&&x.how.indexOf("http")===0?"<a href='"+x.how+"' target='_blank' rel="noopener">فتح ↗</a>":(x.how?"<span class='c'>"+x.how+"</span>":""))+"</div>";}).join("")||"<span class='ok'>لا فجوات ✓</span>";
 var T=document.getElementById("apis");
 T.innerHTML=(a.apis||[]).map(function(x){return "<tr><td>"+x.name+"</td><td class='"+(x.ok?"ok":"bad")+"'>"+x.code+"</td><td>"+(x.items===null?"—":x.items)+"</td></tr>";}).join("");
 document.getElementById("miss").innerHTML=(a.live_missing||[]).map(function(f){return "<span class='bad'>✗ "+f+" </span>";}).join("")||"<span class='ok'>لا شيء ✓</span>";
});
})();
</script><script src="hits.js" defer></script><a id="chagent" href="/agent.html" style="position:fixed;bottom:16px;left:16px;z-index:99999;background:#2563eb;color:#fff;padding:10px 14px;border-radius:30px;text-decoration:none;font:700 13px system-ui;box-shadow:0 4px 16px #0008">🤖 الوكيل</a>
