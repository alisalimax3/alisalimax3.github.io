<h1>ربط حقيقي: توكن + كابتشا + مفاتيح + حساب</h1>
<div class="box"><b>1) هوية الجهاز</b><div id="q">…</div><input id="a" placeholder="الجواب"><button type="button" id="cb">تحقّق وولّد الهوية</button><div id="io" class="c"></div></div>
<div class="box"><b>2) توكن GitHub (repo + workflow)</b><input id="t" placeholder="ghp_… أو github_pat_…">
<button type="button" id="tb">تحقّق من التوكن وصلاحياته</button><div id="to" class="c"></div>
<p class="c"><a href="https://github.com/settings/tokens/new?scopes=repo,workflow&description=CineHub3099" target="_blank" rel="noopener">إنشاء توكن بالصلاحيات الصحيحة</a></p></div>
<div class="box"><b>3) حساب الكريمي</b><input id="kn" placeholder="الاسم الكامل"><input id="ka" placeholder="رقم الحساب">
<input id="kp" placeholder="رقم الهاتف"><input id="kw" placeholder="واتساب (اختياري)"><button type="button" id="ob">حفظ الحساب</button></div>
<div class="box"><b>4) التفعيل</b><button type="button" id="go">دفع كل شيء + تشغيل دورة فورية</button><div id="st" class="c"></div></div>
<script>
(function(){
"use strict";
function S(m,c){var e=document.getElementById("st");e.className=c||"c";e.textContent=m;}
var a=Math.floor(Math.random()*9)+2,b=Math.floor(Math.random()*9)+2;
document.getElementById("q").textContent="كم يساوي "+a+" + "+b+" ؟";
document.getElementById("cb").onclick=function(){
 if(parseInt(document.getElementById("a").value,10)!==a+b){S("جواب الكابتشا خطأ","bad");return;}
 crypto.subtle.digest("SHA-256",new TextEncoder().encode("ch3099|"+(a+b)+"|"+navigator.userAgent+"|"+screen.width))
 .then(function(buf){var h=Array.prototype.map.call(new Uint8Array(buf),function(x){return ("0"+x.toString(16)).slice(-2)}).join("");
  localStorage.setItem("ch3099_identity",h);
  document.getElementById("io").innerHTML="الهوية: <code>"+h.slice(0,40)+"…</code> صالحة سنة";
  S("تم التحقق من الكابتشا ✓","ok");});
};
document.getElementById("tb").onclick=function(){
 var t=document.getElementById("t").value.trim();
 fetch("https://api.github.com/user",{headers:{Authorization:"token "+t}})
 .then(function(r){if(!r.ok)throw 0;return r.json().then(function(j){return {j:j,r:r};});})
 .then(function(o){
  var sc=o.r.headers.get("x-oauth-scopes")||"";
  var has=sc.indexOf("repo")>-1&&sc.indexOf("workflow")>-1;
  localStorage.setItem("ch3099_gh",JSON.stringify({token:t,repo:o.j.login+"/"+o.j.login+".github.io",branch:"main"}));
  document.getElementById("to").innerHTML="المستخدم: <b>"+o.j.login+"</b><br>الصلاحيات: <code>"+sc+"</code><br>"+
   (has?'<span class="ok">repo+workflow ✓</span>':'<span class="bad">ناقص repo أو workflow</span>');
 }).catch(function(){S("التوكن غير صالح","bad");});
};
document.getElementById("ob").onclick=function(){
 var o={kuraimi:{name:document.getElementById("kn").value.trim(),account:document.getElementById("ka").value.trim(),
  phone:document.getElementById("kp").value.trim()},whatsapp:document.getElementById("kw").value.trim(),
  identity:localStorage.getItem("ch3099_identity")||"",bank:"Al-Kuraimi Islamic Microfinance Bank",
  swift:"KBMFYESAXXX",updated:new Date().toISOString()};
 localStorage.setItem("ch3099_owner",JSON.stringify(o)); S("حُفظ الحساب ✓","ok");};
function put(path,text,msg){var gh=JSON.parse(localStorage.getItem("ch3099_gh")||"{}");
 if(!gh.token)return Promise.reject("no token");
 var url="https://api.github.com/repos/"+gh.repo+"/contents/"+path;
 var H={Authorization:"token "+gh.token,"Content-Type":"application/json"};
 return fetch(url,{headers:H}).then(function(r){return r.ok?r.json():null}).then(function(j){
  var body={message:msg,content:btoa(unescape(encodeURIComponent(text))),branch:gh.branch};
  if(j&&j.sha)body.sha=j.sha;
  return fetch(url,{method:"PUT",headers:H,body:JSON.stringify(body)});});}
document.getElementById("go").onclick=function(){
 var gh=JSON.parse(localStorage.getItem("ch3099_gh")||"{}");
 var own=JSON.parse(localStorage.getItem("ch3099_owner")||"{}");
 var keys=JSON.parse(localStorage.getItem("ch3099_keys")||"{}");
 var env=Object.keys(keys).filter(function(k){return keys[k]}).map(function(k){return k+"="+keys[k]}).join("\n")+"\n";
 env+="CH3099_IDENTITY="+(localStorage.getItem("ch3099_identity")||"")+"\n";
 if(!gh.token){S("أدخل التوكن أولًا","bad");return;}
 S("جارٍ الدفع…");
 put("keys.env",env,"keys via link").then(function(){return put("owner.json",JSON.stringify(own,null,1),"owner via link");})
 .then(function(){return fetch("https://api.github.com/repos/"+gh.repo+"/dispatches",
   {method:"POST",headers:{Authorization:"token "+gh.token,"Content-Type":"application/json"},
    body:JSON.stringify({event_type:"agent-cycle"})});})
 .then(function(){S("تم الدفع وتشغيل دورة فورية ✓ — الأرقام تتحرك خلال 5 دقائق","ok");})
 .catch(function(e){S("فشل: "+e,"bad");});};
})();

<script>
(function(){
var doc=document;
function ready(fn){if(doc.readyState!=='loading')fn();else doc.addEventListener('DOMContentLoaded',fn);}
ready(function(){
  if(!doc.querySelector('link[rel=manifest]')){var l=doc.createElement('link');l.rel='manifest';l.href='/manifest.webmanifest';doc.head.appendChild(l);}
  if(!doc.querySelector('meta[name=theme-color]')){var m=doc.createElement('meta');m.name='theme-color';m.content='#0a0c15';doc.head.appendChild(m);}
  if(!doc.querySelector('meta[name=viewport]')){var v=doc.createElement('meta');v.name='viewport';v.content='width=device-width,initial-scale=1,viewport-fit=cover';doc.head.appendChild(v);}

  if(!doc.querySelector('.vn-top') && !doc.querySelector('header,.topbar')){
    var h=doc.createElement('div');h.className='vn-top';
    h.innerHTML='<span class="vn-logo">CineHub 3099</span><input id="vn-q" placeholder="ابحث عن فيلم...">';
    doc.body.insertBefore(h,doc.body.firstChild);
    h.querySelector('#vn-q').addEventListener('input',function(){
      var q=this.value.trim().toLowerCase();
      doc.querySelectorAll('.vn-card,.card,.movie,.item').forEach(function(el){
        el.style.display=(!q||(el.textContent||'').toLowerCase().indexOf(q)>-1)?'':'none';
      });
    });
  }

  if(!doc.querySelector('.vn-nav')){
    var p=location.pathname.replace(//$/,'')||'/';
    var L=[['/','🏠','الرئيسية'],['/movies.html','🎬','أفلام'],['/vn-wallet.html','💰','المحفظة'],['/vn-panel.html','📊','اللوحة'],['/app.html','⚙️','التطبيق']];
    var n=doc.createElement('nav');n.className='vn-nav';
    n.innerHTML=L.map(function(x){var on=(p===x[0]||(x[0]!=='/'&&p.indexOf(x[0])===0))?' class="on"':'';
      return '<a href="'+x[0]+'"'+on+'><span>'+x[1]+'</span>'+x[2]+'</a>';}).join('');
    doc.body.appendChild(n);
  }

  var g=doc.getElementById('g')||doc.querySelector('main,#app,#content');
  function gridify(){ if(!g)return; if(g.children.length>3){var c=g.children[0]; if(c&&c.getBoundingClientRect().width<420&&c.getBoundingClientRect().height>80) g.classList.add('vn-grid'); } }

  if(g && g.children.length===0){
    var sk='';for(var i=0;i<8;i++)sk+='<div class="vn-sk"></div>';
    g.innerHTML='<div class="vn-grid" style="display:grid">'+sk+'</div>';
  }

  var tries=0;
  var iv=setInterval(function(){
    tries++;
    var txt=g?g.textContent:'';
    var bad=g&&(txt.indexOf('تعذّر')>-1||txt.indexOf('تعذر')>-1);
    var empty=g&&g.querySelectorAll('img').length===0&&g.querySelectorAll('a').length<2;
    if((bad||empty)&&tries>=3){clearInterval(iv);fallback();}
    if(tries>12)clearInterval(iv);
  },1500);

  function draw(list){
    if(!g||!list.length)return;
    g.classList.add('vn-grid');
    g.innerHTML=list.map(function(o){
      var t=o.t||o.title||o.name||o.ar||o.en||'';
      var im=o.p||o.th||o.img||o.th||o.th||'';
      var y=o.y||o.year||'';
      var u=o.u||o.url||o.link||o.href||'#';
      var ph=im?'<img loading="lazy" src="'+im+'" alt="" onerror="this.remove()">':'<div class="vn-ph"></div>';
      return '<a class="vn-card" href="'+u+'">'+ph+'<span class="vn-t">'+(t||'بدون عنوان')+'</span>'+(y?'<span class="vn-y">'+y+'</span>':'')+'</a>';
    }).join('');
    gridify();
  }
  function fallback(){
    var srcs=['/catalog-lite.json','catalog-lite.json','catalog-lite.json','catalog-lite.json'];
    (function next(i){
      if(i>=srcs.length){ if(g) g.innerHTML='<p style="color:#98a0b8;text-align:center;padding:24px">تعذّر تحميل الكتالوج — تحقق من الاتصال</p>'; return; }
      fetch(srcs[i]+'?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();})
        .then(function(d){var a=Array.isArray(d)?d:(d.items||[]);if(!a.length)throw 0;draw(a.slice(0,900));})
        .catch(function(){next(i+1);});
    })(0);
  }

  setTimeout(gridify,2500);
  setTimeout(function(){doc.querySelectorAll('.ad iframe,iframe.ad').forEach(function(f){try{if(f.getBoundingClientRect().height<10)f.style.display='none';}catch(e){}});},6000);
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.update();});});}
});
})();
</script>
