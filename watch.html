<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مشاهدة — CineHub 3099</title><meta name="theme-color" content="#0a0c15">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0a0c15;color:#eef1f8;font-family:Cairo,system-ui,sans-serif;padding-bottom:90px}
.w{max-width:1000px;margin:0 auto;padding:12px}
.bk{color:#98a0b8;text-decoration:none;font-size:13px;display:inline-block;margin:6px 0 10px}
.pl{aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.pl iframe,.pl video{width:100%;height:100%;border:0;display:block}
h1{font-size:19px;margin:14px 0 6px}.mt{color:#98a0b8;font-size:12.5px}
.src{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.src button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#eef1f8;padding:8px 14px;border-radius:999px;font-family:inherit;font-size:12px}
.src button.on{background:linear-gradient(135deg,#6c5ce7,#00d2ff);border-color:transparent;color:#fff}
</style></head><body><div class="w">
<a class="bk" href="/">← الرئيسية</a>
<div class="pl" id="pl"></div><h1 id="t">...</h1><div class="mt" id="mt"></div><div class="src" id="src"></div>
</div><script>
var Q=new URLSearchParams(location.search);
var ID=Q.get('id'), E=Q.get('e')||'', T=Q.get('t')||'';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}
function play(u){var p=document.getElementById('pl');
 if(!u){p.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#98a0b8;font-size:13px">لا يوجد مصدر تشغيل</div>';return;}
 if(/\.(mp4|m4v|webm)(\?|$)/i.test(u))p.innerHTML='<video src="'+u+'" controls autoplay playsinline></video>';
 else p.innerHTML='<iframe src="'+u+'" allowfullscreen allow="autoplay;fullscreen"></iframe>';}
function show(it){
 document.getElementById('t').textContent=it.t||it.title||T||'';
 document.getElementById('mt').textContent=[it.y||it.year,it.c||it.cat].filter(Boolean).join(' · ');
 var urls=[it.e,it.embed,it.u,it.url].filter(Boolean);
 if(!urls.length)urls=['https://www.youtube.com/embed?listType=search&list='+encodeURIComponent(it.t||it.title||T||'')];
 var s=document.getElementById('src');
 s.innerHTML=urls.map(function(u,i){return '<button data-u="'+esc(u)+'"'+(i?'':' class="on"')+'>مصدر '+(i+1)+'</button>'}).join('');
 s.onclick=function(e){var b=e.target.closest('button');if(!b)return;
  s.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');play(b.dataset.u);};
 play(urls[0]);
}
document.getElementById('t').textContent=T||'...';
if(E)play(E);
fetch('/catalog-lite.json').then(function(r){return r.json()}).then(function(d){
 var a=d.items||[], it=null;
 if(ID!=null)it=a.filter(function(x){return String(x.i||x.id)==String(ID)})[0];
 if(!it&&T)it=a.filter(function(x){return (x.t||x.title)==T})[0];
 if(it)show(it); else if(!E)play(null);
}).catch(function(){if(!E)play(null);});
</script></body></html>
