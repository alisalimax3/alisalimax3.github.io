<script>
(function(){
var doc=document;
function ready(fn){if(doc.readyState!=='loading')fn();else doc.addEventListener('DOMContentLoaded',fn);}
ready(function(){
  if(!doc.querySelector('link[rel=manifest]')){var l=doc.createElement('link');l.rel='manifest';l.href='/manifest.webmanifest';doc.head.appendChild(l);}
  if(!doc.querySelector('meta[name=theme-color]')){var m=doc.createElement('meta');m.name='theme-color';m.content='#0a0c15';doc.head.appendChild(m);}
  if(!doc.querySelector('meta[name=viewport]')){var v=doc.createElement('meta');v.name='viewport';v.content='width=device-width,initial-scale=1,viewport-fit=cover';doc.head.appendChild(v);}

  if(!doc.querySelector('.vn-top') && !doc.querySelector('header,.topbar')){
    var h=doc.createElement('div');h.className='vn-top';
    h.innerHTML='<span class="vn-logo">CineHub 3099</span><input id="vn-q" placeholder="ابحث عن فيلم...">';
    doc.body.insertBefore(h,doc.body.firstChild);
    h.querySelector('#vn-q').addEventListener('input',function(){
      var q=this.value.trim().toLowerCase();
      doc.querySelectorAll('.vn-card,.card,.movie,.item').forEach(function(el){
        el.style.display=(!q||(el.textContent||'').toLowerCase().indexOf(q)>-1)?'':'none';
      });
    });
  }

  if(!doc.querySelector('.vn-nav')){
    var p=location.pathname.replace(//$/,'')||'/';
    var L=[['/','🏠','الرئيسية'],['/movies.html','🎬','أفلام'],['/vn-wallet.html','💰','المحفظة'],['/vn-panel.html','📊','اللوحة'],['/app.html','⚙️','التطبيق']];
    var n=doc.createElement('nav');n.className='vn-nav';
    n.innerHTML=L.map(function(x){var on=(p===x[0]||(x[0]!=='/'&&p.indexOf(x[0])===0))?' class="on"':'';
      return '<a href="'+x[0]+'"'+on+'><span>'+x[1]+'</span>'+x[2]+'</a>';}).join('');
    doc.body.appendChild(n);
  }

  var g=doc.getElementById('g')||doc.querySelector('main,#app,#content');
  function gridify(){ if(!g)return; if(g.children.length>3){var c=g.children[0]; if(c&&c.getBoundingClientRect().width<420&&c.getBoundingClientRect().height>80) g.classList.add('vn-grid'); } }

  if(g && g.children.length===0){
    var sk='';for(var i=0;i<8;i++)sk+='<div class="vn-sk"></div>';
    g.innerHTML='<div class="vn-grid" style="display:grid">'+sk+'</div>';
  }

  var tries=0;
  var iv=setInterval(function(){
    tries++;
    var txt=g?g.textContent:'';
    var bad=g&&(txt.indexOf('تعذّر')>-1||txt.indexOf('تعذر')>-1);
    var empty=g&&g.querySelectorAll('img').length===0&&g.querySelectorAll('a').length<2;
    if((bad||empty)&&tries>=3){clearInterval(iv);fallback();}
    if(tries>12)clearInterval(iv);
  },1500);

  function draw(list){
    if(!g||!list.length)return;
    g.classList.add('vn-grid');
    g.innerHTML=list.map(function(o){
      var t=o.t||o.title||o.name||o.ar||o.en||'';
      var im=o.p||o.poster||o.img||o.image||o.thumb||'';
      var y=o.y||o.year||'';
      var u=o.u||o.url||o.link||o.href||'#';
      var ph=im?'<img loading="lazy" src="'+im+'" alt="" onerror="this.remove()">':'<div class="vn-ph"></div>';
      return '<a class="vn-card" href="'+u+'">'+ph+'<span class="vn-t">'+(t||'بدون عنوان')+'</span>'+(y?'<span class="vn-y">'+y+'</span>':'')+'</a>';
    }).join('');
    gridify();
  }
  function fallback(){
    var srcs=['/catalog-lite.json','catalog-lite.json','/catalog.json','catalog.json'];
    (function next(i){
      if(i>=srcs.length){ if(g) g.innerHTML='<p style="color:#98a0b8;text-align:center;padding:24px">تعذّر تحميل الكتالوج — تحقق من الاتصال</p>'; return; }
      fetch(srcs[i]+'?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();})
        .then(function(d){var a=Array.isArray(d)?d:(d.items||[]);if(!a.length)throw 0;draw(a.slice(0,900));})
        .catch(function(){next(i+1);});
    })(0);
  }

  setTimeout(gridify,2500);
  setTimeout(function(){doc.querySelectorAll('.ad iframe,iframe.ad').forEach(function(f){try{if(f.getBoundingClientRect().height<10)f.style.display='none';}catch(e){}});},6000);
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.update();});});}
});
})();
</script>
