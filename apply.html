var D=[],DONE={},CODES={},SHOWN=250;
function K(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}}
function S(k,v){localStorage.setItem(k,JSON.stringify(v))}
Promise.all([fetch('/platforms.json?t='+Date.now()).then(r=>r.json()).catch(()=>({platforms:[]})),
 fetch('/referrals.json?t='+Date.now()).then(r=>r.json()).catch(()=>({top:[]})),
 fetch('/owner.json?t='+Date.now()).then(r=>r.json()).catch(()=>({}))]).then(a=>{
 var j=a[0],ref=a[1],own=a[2];D=j.platforms||[];DONE=K('ch_applied');CODES=K('ch_codes');
 var rate={};(ref.top||[]).forEach(x=>rate[x.id]=x.pct);
 var order={short:0,cpa:1,ptc:2,gpt:3,ad:4,aff:5,video:6,write:7,micro:8,crypto:9,seo:10};
 D.sort(function(x,y){return (order[x.c]||99)-(order[y.c]||99)||(rate[y.id]||0)-(rate[x.id]||0)});
 document.getElementById('fc').innerHTML='<option value="">كل التصنيفات ('+D.length+')</option>'+
  Object.keys(j.cats||{}).map(c=>'<option value="'+c+'">'+j.cats[c]+'</option>').join('');
 draw();prog();
});
function draw(){var c=document.getElementById('fc').value,q=(document.getElementById('q').value||'').toLowerCase();
 var rows=D.filter(x=>(!c||x.c===c)&&(!q||(x.n+x.note).toLowerCase().includes(q)));
 document.getElementById('tb').innerHTML=rows.map(function(x,i){
  var col=x.ye==='high'?'#22c55e':x.ye==='mid'?'#fbbf24':'#f87171';
  var tag=col==='#22c55e'?'مباشر':col==='#fbbf24'?'بوسيط':'يحتاج وسيط';
  return '<tr><td>'+(i+1)+'</td><td><b>'+x.n+'</b><br><span class="l">'+x.note+'</span></td>'+
   '<td class="big">'+(x.model==='ppc'||x.model==='cpa'?'$':'')+ (x.min||0) + (x.model==='ppc'?'+/1000':x.model==='cpa'?'+':'') +'</td>'+
   '<td>$'+(x.min||0)+'</td><td class="l">'+(x.p||[]).join(' · ')+'</td>'+
   '<td><span class="pill" style="color:'+col+';border-color:'+col+'55">'+tag+'</span></td>'+
   '<td><input style="width:110px" value="'+(CODES[x.id]||'')+'" placeholder="كود/ID" oninput="setc(\''+x.id+'\',this.value)"></td>'+
   '<td>'+(DONE[x.id]?'<span class="pill" style="color:#22c55e;border-color:#22c55e55">✓ مسجّل</span>':'<span class="l">—</span>')+'</td>'+
   '<td><a class="b" target="_blank" rel="noopener" href="'+x.u+'">سجّل</a> <button onclick="mark(\''+x.id+'\')" style="background:#0d1424;color:#e8f6ff;border:1px solid #1e2a44;border-radius:8px;padding:4px 8px">✓</button></td></tr>'}).join('')
  ||'<tr><td colspan=9 class="l">لا نتائج</td></tr>';
 if(total>SHOWN&&!q)document.getElementById('tb').insertAdjacentHTML('beforeend','<tr><td colspan=9><button id="loadmore" onclick="SHOWN+=250;draw()">تحميل المزيد ('+(total-SHOWN)+' متبقٍ من '+total+')</button></td></tr>');;prog();}
function mark(id){DONE[id]=DONE[id]?0:1;S('ch_applied',DONE);draw()}
function setc(id,v){CODES[id]=v;S('ch_codes',CODES)}
function prog(){var n=Object.keys(DONE).filter(k=>DONE[k]).length;var pc=D.length?(n/D.length*100):0;
 document.getElementById('pgi').style.width=pc.toFixed(1)+'%';
 document.getElementById('pg').textContent=n+' من '+D.length+' ('+pc.toFixed(1)+'%)';}
function exportJSON(){var o={};Object.keys(CODES).forEach(k=>{if(CODES[k])o[k]=CODES[k]});
 document.getElementById('out').textContent=JSON.stringify(o,null,1);navigator.clipboard.writeText(JSON.stringify(o,null,1));}
function clearAll(){DONE={};CODES={};S('ch_applied',{});S('ch_codes',{});draw();}
