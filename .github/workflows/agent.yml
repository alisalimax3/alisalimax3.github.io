name: agent
on:
  schedule: [{cron: "5 */2 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: agent, cancel-in-progress: false}
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          python3 tools/tasks.py || true
          for s in revenue_sync hits_report vault money dashboard share earn ping; do
            [ -f "tools/$s.py" ] && python3 "tools/$s.py" || true
          done
          git config user.email a@c.local; git config user.name agent
          git add -A; git commit -m "cycle $(date -u +%FT%TZ)" || true; git push || true
