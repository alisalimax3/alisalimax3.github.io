name: agent
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agent
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: دورة الوكيل
        run: node money/wideagent.mjs --once
      - name: حفظ ورفع
        run: |
          git config user.name  "cinehub-agent"
          git config user.email "agent@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "agent: cloud cycle $(date -u +%FT%TZ)"
          git pull --rebase --autostash origin main || true
          git push
