name: pulse
on:
  schedule: [{cron: '*/5 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: pulse, cancel_in_progress: false}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tools/pulse.py
      - run: |
          git config user.name cinehub-bot; git config user.email bot@users.noreply.github.com
          git add -A; git diff --cached --quiet || git commit -m "pulse $(date -u +%FT%TZ) [skip ci]"; git push
