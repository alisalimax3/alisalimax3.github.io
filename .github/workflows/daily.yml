name: daily
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/daily.py
      - run: python3 tools/snapshot.py
      - run: |
          git config user.name cinehub-bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "daily $(date -u +%F) [skip ci]"
          git push
