name: verify-links
on:
  schedule: [{cron: '31 4 * * 1'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tools/accounts_check.py
      - run: |
          git config user.name cinehub-bot; git config user.email bot@users.noreply.github.com
          git add -A; git diff --cached --quiet || git commit -m "verify links $(date -u +%F) [skip ci]"; git push
