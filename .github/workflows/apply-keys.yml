name: apply-keys
on:
  push: {paths: ['keys.env']}
  workflow_dispatch:
permissions: {contents: write}
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tools/apply_keys.py
      - run: python3 tools/health.py
      - run: |
          git config user.name cinehub-bot; git config user.email bot@users.noreply.github.com
          git add -A; git diff --cached --quiet || git commit -m "keys applied [skip ci]"; git push
