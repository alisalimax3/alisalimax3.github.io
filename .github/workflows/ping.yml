name: ping
on:
  schedule: [{cron: '17 */6 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tools/daily.py && python3 tools/ping.py
      - run: |
          git config user.name cinehub-bot; git config user.email bot@users.noreply.github.com
          git add -A; git diff --cached --quiet || git commit -m "ping $(date -u +%FT%TZ) [skip ci]"; git push
