name: ingest
on:
  schedule: [{cron: '23 1 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  i:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tools/ingest_archive.py || true
      - run: python3 tools/ingest_open.py || true
      - run: python3 tools/build_index.py
      - run: |
          git config user.name cinehub-bot; git config user.email bot@users.noreply.github.com
          git add -A; git diff --cached --quiet || git commit -m "ingest $(date -u +%F) [skip ci]"; git push
