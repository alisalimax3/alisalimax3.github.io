name: tick
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tick
  cancel_in_progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pull real revenue
        env:
          ADSTERRA_API_KEY: ${{ secrets.ADSTERRA_API_KEY }}
          MONETAG_API_KEY: ${{ secrets.MONETAG_API_KEY }}
          PROPELLER_API_KEY: ${{ secrets.PROPELLER_API_KEY }}
          POPADS_API_KEY: ${{ secrets.POPADS_API_KEY }}
          ADMAVEN_API_KEY: ${{ secrets.ADMAVEN_API_KEY }}
          CLICKADU_API_KEY: ${{ secrets.CLICKADU_API_KEY }}
          HILLTOP_API_KEY: ${{ secrets.HILLTOP_API_KEY }}
          ADCASH_API_KEY: ${{ secrets.ADCASH_API_KEY }}
        run: python3 tools/networks.py
      - name: commit
        run: |
          git config user.name cinehub-bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "tick $(date -u +%FT%TZ) [skip ci]"
          git push
