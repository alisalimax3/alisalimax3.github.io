name: archive
on:
  schedule: [{cron: '47 6 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tools/ingest_archive.py
      - run: |
          git config user.name cinehub-bot; git config user.email bot@users.noreply.github.com
          git add -A; git diff --cached --quiet || git commit -m "archive $(date -u +%F) [skip ci]"; git push
