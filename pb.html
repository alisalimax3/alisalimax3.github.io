<script>(function(){try{
var C=window.__APEX_C||"";var EP="/api/apex/event";
function send(o){o.id=o.id||(Date.now()+"-"+Math.random().toString(36).slice(2,9));
 var body=JSON.stringify(o);try{navigator.sendBeacon(EP,new Blob([body],{type:"application/json"}));return}catch(e){}
 try{fetch(EP,{method:"POST",headers:{"Content-Type":"application/json"},body:body,keepalive:true}).catch(function(){try{fetch("http://127.0.0.1:8792/api/apex/event",{method:"POST",headers:{"Content-Type":"application/json"},body:body}).catch(function(){})}catch(e){}})}catch(e){}}
var c=document.documentElement.getAttribute("data-apex-circle")||"general";
send({type:"pageview",page:location.pathname,circle:c,ref:document.referrer,ua:navigator.userAgent});
if("IntersectionObserver" in window){
 var o=new IntersectionObserver(function(es){es.forEach(function(en){
  if(en.isIntersecting&&en.intersectionRatio>=0.5){send({type:"impression",slot:en.target.getAttribute("data-apex-slot")||"body",page:location.pathname,circle:c});o.unobserve(en.target);}});},{threshold:[0.5]});
 setTimeout(function(){document.querySelectorAll("[data-apex-slot]").forEach(function(el){o.observe(el)})},800);
}})();</script>

<h3>استقبال إيراد الإعلان</h3><div id="s" class="mut">…</div>
<script>(function(){
var q=new URLSearchParams(location.search);
var amt=parseFloat(q.get('amt')||q.get('revenue')||q.get('payout')||'0');
var src=q.get('src')||q.get('sub_id')||q.get('network')||'ads';
var tx=q.get('tx')||q.get('tx_id')||String(Date.now());
var out=document.getElementById('s');
if(!(amt>0)){out.textContent='لا مبلغ في الرابط';return;}
function j(u){return fetch(u+'?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});}
function b64(s){return btoa(String.fromCharCode.apply(null,new TextEncoder().encode(s)));}
j('pb.json').then(function(cfg){ j('auth.json').then(function(a){
 var tok=(cfg&&cfg.token)||(a&&a.token),repo=(cfg&&cfg.repo)||(a&&a.repo),br='main';
 if(!tok){out.innerHTML='<span class="bad">لا توكن للكتابة</span>';return;}
 var fn='ev-'+tx+'.json';
 fetch('https://api.github.com/repos/'+repo+'/contents/pb/'+fn,{method:'PUT',
  headers:{Authorization:'token '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},
  body:JSON.stringify({message:'ads +'+amt,branch:br,content:b64(JSON.stringify({src:'ads:'+src,amount:amt,note:'postback',at:Math.floor(Date.now()/1000)}))})})
 .then(function(r){return r.json().then(function(x){return {s:r.status};});})
 .then(function(r){out.innerHTML=r.s<300?'<span class="ok">✓ سُجل $'+amt+'</span>':'<span class="bad">فشل '+r.s+'</span>';});
});});})();</script><script src="hits.js" defer></script><a id="chagent" href="/agent.html" style="position:fixed;bottom:16px;left:16px;z-index:99999;background:#2563eb;color:#fff;padding:10px 14px;border-radius:30px;text-decoration:none;font:700 13px system-ui;box-shadow:0 4px 16px #0008">🤖 الوكيل</a>
