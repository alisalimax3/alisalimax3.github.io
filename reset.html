<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>تنظيف الكاش</title>
<style>body{margin:0;background:#0a0c15;color:#eef1f8;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:14px}
b{font-size:18px}small{color:#98a0b8}</style></head><body>
<b>جاري تنظيف الكاش...</b><small id="s">لحظة</small>
<script>
(async function(){
  var log=[];
  try{if('serviceWorker' in navigator){var rs=await navigator.serviceWorker.getRegistrations();
    for(var i=0;i<rs.length;i++){await rs[i].unregister();} log.push('SW: '+rs.length);}}catch(e){}
  try{if(window.caches){var ks=await caches.keys();
    for(var j=0;j<ks.length;j++){await caches.delete(ks[j]);} log.push('caches: '+ks.length);}}catch(e){}
  document.getElementById('s').textContent=log.join(' · ')+' — تحويل...';
  setTimeout(function(){location.replace('/?fresh='+Date.now());},900);
})();
</script></body></html>
