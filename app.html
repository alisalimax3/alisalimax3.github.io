<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CineHub 3099 — التطبيق</title>
<meta name="theme-color" content="#0a0c15">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#0a0c15;--cd:rgba(255,255,255,.045);--bd:rgba(255,255,255,.09);--tx:#eef1f8;--mu:#98a0b8;--a1:#6c5ce7;--a2:#00d2ff}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,-apple-system,sans-serif}
body{padding-bottom:86px}
.hd{position:sticky;top:0;z-index:60;display:flex;gap:10px;align-items:center;padding:10px 14px;background:rgba(10,12,21,.82);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.logo{font-weight:900;font-size:17px;white-space:nowrap}
.logo span{background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo em{font-size:10px;color:var(--mu);font-style:normal;margin-inline-start:4px}
.hd input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid var(--bd);color:var(--tx);border-radius:999px;padding:9px 14px;font-family:inherit;font-size:13px}
.hd button{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border:0;border-radius:999px;padding:9px 14px;font-weight:700;font-family:inherit;font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.ch{white-space:nowrap;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--bd);color:var(--mu);font-family:inherit;font-size:12.5px}
.ch.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;padding:12px 14px}
@media(max-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px;padding:10px}}
.c{display:block;border-radius:14px;overflow:hidden;background:var(--cd);border:1px solid var(--bd);text-decoration:none;color:inherit;transition:transform .22s,box-shadow .22s}
.c:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.c img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#12141f}
.c .ph{width:100%;aspect-ratio:2/3;background:linear-gradient(135deg,rgba(108,92,231,.25),rgba(0,210,255,.12))}
.c b{display:block;padding:8px 9px 2px;font-size:12.5px;font-weight:700;line-height:1.35}
.c i{display:block;padding:0 9px 9px;font-size:10.5px;color:var(--mu);font-style:normal}
.more{display:none;margin:6px auto 18px;padding:11px 26px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--bd);color:var(--tx);font-family:inherit;font-weight:700;font-size:13px;width:max-content;cursor:pointer}
.diag{position:fixed;bottom:88px;inset-inline:12px;display:none;background:rgba(10,12,21,.92);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;font-size:11px;color:var(--mu);backdrop-filter:blur(12px)}
.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--mu)}
.bn{position:fixed;bottom:0;inset-inline:0;z-index:80;display:flex;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom));background:rgba(10,12,21,.94);backdrop-filter:blur(18px);border-top:1px solid var(--bd)}
.bn a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--mu);text-decoration:none;padding:3px 9px;border-radius:11px}
.bn a span{font-size:18px;line-height:1}
.bn a.on,.bn a:hover{color:#fff;background:rgba(108,92,231,.18)}
</style>
</head>
<body>
<header class="hd">
  <div class="logo">CineHub<span>3099</span><em>v4</em></div>
  <input id="q" placeholder="ابحث عن فيلم...">
  <button id="inst" hidden>تثبيت</button>
</header>
<nav class="chips" id="chips"><button class="ch on">الكل</button></nav>
<main class="grid" id="grid"></main>
<button class="more" id="more">تحميل المزيد</button>
<div class="diag" id="diag"></div>
<nav class="bn">
  <a href="/" class="on"><span>🏠</span>الرئيسية</a>
  <a href="/movies.html"><span>🎬</span>أفلام</a>
  <a href="/sites.html"><span>🌐</span>مواقع</a>
  <a href="/vn-wallet.html"><span>💰</span>المحفظة</a>
  <a href="/app.html"><span>⚙️</span>التطبيق</a>
</nav>
<script>
(function(){
var ALL=[],PAGE=0,PAGES=0,CAT='';
function D(m){var d=document.getElementById('diag');d.style.display='block';d.textContent=m;}
function card(x){
  var t=x.t||x.title||'', th=x.p||x.th||'', y=x.y||x.year||'';
  var id=encodeURIComponent(x.i||x.id||''), e=encodeURIComponent(x.e||x.u||'');
  var img = th ? '<img loading="lazy" src="'+th+'" alt="" onerror="this.style.opacity=.12">' : '<div class="ph"></div>';
  return '<a class="c" href="/watch.html?id='+id+'&e='+e+'&t='+encodeURIComponent(t)+'">'+img+'<b>'+t+'</b>'+(y?'<i>'+y+'</i>':'')+'</a>';
}
function render(){
  var g=document.getElementById('grid');
  var l=CAT?ALL.filter(function(x){return String(x.c||x.cat||'').indexOf(CAT)>-1}):ALL;
  g.innerHTML = l.length ? l.map(card).join('') : '<div class="empty">لا نتائج</div>';
  D('الإصدار v4 · محمّل: '+ALL.length+' · معروض: '+l.length+(CAT?' · '+CAT:''));
}
function page(i){return fetch('/catalog-p'+i+'.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  PAGES=d.pages||1;ALL=ALL.concat(d.items||[]);PAGE=i+1;render();});}
fetch('/catalog-index.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){PAGES=d.pages||1;return page(0);})
 .catch(function(){return fetch('/catalog-lite.json').then(function(r){return r.json()}).then(function(d){ALL=d.items||[];render();});})
 .then(function(){if(PAGES>1)document.getElementById('more').style.display='block';})
 .catch(function(e){D('فشل تحميل الكتالوج: '+(e&&e.message||e));});
document.getElementById('more').onclick=function(){if(PAGE<PAGES)page(PAGE);else this.textContent='خلص';};
fetch('/catalog-cats.json').then(function(r){return r.json()}).then(function(d){
  var c=d.cats||[];
  document.getElementById('chips').innerHTML='<button class="ch on">الكل</button>'+c.map(function(x){return '<button class="ch">'+x+'</button>'}).join('');
  document.getElementById('chips').onclick=function(e){var b=e.target.closest('.ch');if(!b)return;
    document.querySelectorAll('.ch').forEach(function(x){x.classList.remove('on')});b.classList.add('on');
    CAT=b.textContent==='الكل'?'':b.textContent;render();};
}).catch(function(){});
document.getElementById('q').oninput=function(){var q=this.value.trim().toLowerCase();
  document.querySelectorAll('#grid .c').forEach(function(el){
    el.style.display=(!q||el.textContent.toLowerCase().indexOf(q)>-1)?'':'none';});};
var dp;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;var b=document.getElementById('inst');b.hidden=false;b.onclick=function(){dp.prompt()};});
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){
    var u=(r.active&&r.active.scriptURL)||'';if(u.indexOf('sw4')<0)r.unregister();});})
  .then(function(){navigator.serviceWorker.register('/sw4.js?v=4');}).catch(function(){});
}
})();
</script>
</body>
</html>
