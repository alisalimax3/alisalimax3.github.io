<h1>التسجيل والتحقق</h1>
<div class="card">
  <p style="color:#8b97b3;margin-top:0">سجّل بياناتك مرة واحدة، ثم اضغط «سجّل» بجانب كل منصة — تُفتح صفحة التسجيل مباشرة، وتُحفظ حالتك محلياً.</p>
  <select id="pid"></select>
  <input id="em" type="email" placeholder="البريد الإلكتروني المستخدم في التسجيل">
  <input id="cc" placeholder="البلد (مثال: Yemen)" value="Yemen">
  <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-theme="dark"></div>
  <button id="go">تحقّق ثم افتح صفحة التسجيل</button>
  <p id="msg" style="color:#8b97b3"></p>
</div>
<div class="card"><b>سجل التسجيلات</b>
  <table><thead><tr><th>المنصة</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody id="tb"></tbody></table>
  <button id="exp" style="margin-top:10px">تصدير JSON</button>
</div>
<script>
var K='ch3099_signups',P=[];
function load(){try{return JSON.parse(localStorage.getItem(K))||[]}catch(e){return[]}}
function save(a){localStorage.setItem(K,JSON.stringify(a))}
function render(){
  var a=load(),tb=document.getElementById('tb');tb.innerHTML='';
  a.forEach(function(r){
    var t=document.createElement('tr');
    t.innerHTML='<td>'+r.n+'</td><td class="'+(r.s==='مؤكد'?'ok':'w')+'">'+r.s+'</td><td>'+r.d+'</td>';
    tb.appendChild(t);
  });
  if(!a.length)tb.innerHTML='<tr><td colspan="3" style="color:#8b97b3">لا تسجيلات بعد</td></tr>';
}
fetch('/platforms.json').then(function(r){return r.json()}).then(function(j){
  P=j.platforms;var s=document.getElementById('pid');
  P.forEach(function(x){var o=document.createElement('option');o.value=x.id;o.textContent=x.n+' — $'+x.min;o.dataset.u=x.u;s.appendChild(o)});
  render();
});
document.getElementById('go').onclick=function(){
  var m=document.getElementById('msg'),sel=document.getElementById('pid');
  var tok=document.querySelector('[name="cf-turnstile-response"]');
  if(!tok||!tok.value){m.textContent='⚠ أكمل الكابتشا أولاً';return}
  var p=P.find(function(x){return x.id===sel.value});
  var a=load();a.unshift({n:p.n,s:'بانتظار التأكيد',d:new Date().toISOString().slice(0,10),em:document.getElementById('em').value,cc:document.getElementById('cc').value});
  save(a);render();
  m.textContent='✓ فُتحت صفحة '+p.n+' — أكمل التسجيل ثم ارجع واضغط «تصدير»';
  window.open(p.u,'_blank','noopener');
};
document.getElementById('exp').onclick=function(){
  var b=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='signups.json';a.click();
};
</script>
